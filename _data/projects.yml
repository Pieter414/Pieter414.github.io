- title: "AI-Generated Video Detection"
  date: May 2026
  blurb: >-
    Evaluated training-free detectors for AI-generated video, combining spatial-temporal likelihoods, second-order features,
    forensic augmentation and face-consistency matching.

- title: "Autoimmune Medical Graph-RAG on WhatsApp"
  tools: Graph-RAG
  blurb: >-
    A WhatsApp assistant backed by a medical Graph-RAG pipeline with query rewriting and context-based database routing.

