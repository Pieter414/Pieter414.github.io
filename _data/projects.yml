# One entry per project, shown in this order. `selected: true` also shows it on the home page.
# Fields: title, date, tools, blurb (Markdown), links (name/url), selected.

- title: "Does Language Shift Break Medical Vision-Language Models? An Indonesian Radiology VQA Case Study"
  date: May 2026
  tools: PyTorch, Transformers, vLLM
  blurb: >-
    Built an Indonesian version of VQA-RAD and benchmarked general, multilingual and medical VLMs on English vs. Bahasa Indonesia prompts.
    Accuracy drops 8–25% in Indonesian, with systematic errors such as yes/no flips, left/right mix-ups and answers in the wrong language.
    Accepted at the CVPR 2026 MMFM-BIOMED Workshop.
  links:
    - name: paper
      url: https://arxiv.org/abs/2606.03693
  selected: true

- title: "~RUPIAH at WMT26: Training-Free Context-Aware Subtitle Translation with QE Selection"
  date: Sep 2026
  tools: HyMT-7B, LLM
  blurb: >-
    A training-free subtitle translation pipeline that adds dialogue history and terminology to the prompt, generates diverse candidates,
    filters off-target outputs and reranks with quality estimation. Placed 3rd (Indonesian) and 5th (English).
  links:
    - name: paper
      url: https://www2.statmt.org/wmt26/pdf/2026.wmt-1.205.pdf
  selected: true

- title: "KomdigiUB-8B-Instruct-PRD2"
  date: Dec 2025
  tools: PyTorch, Hugging Face, PEFT, LoRA
  blurb: >-
    Instruction-tuned the KomdigiUB-8B-Base Indonesian LLM for Indonesian legal compliance and digital-risk monitoring (+2% on IFEval),
    using synthetic instructions generated with Gemini and filtered by an LLM-as-a-judge. Built with the AI Talent Factory, Brawijaya University × Komdigi.
  links:
    - name: model
      url: https://huggingface.co/aitfindonesia/KomdigiUB-8B-Instruct-PRD2
  selected: true

